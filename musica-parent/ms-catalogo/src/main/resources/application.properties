spring.application.name=ms-catalogo
server.port=8089
# Swagger / OpenAPI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html
# Base de Datos
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/db_catalogo}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

# Portadas cargadas desde el administrador
catalogo.upload.dir=${PRODUCT_IMAGES_DIR:/app/uploads/productos}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
